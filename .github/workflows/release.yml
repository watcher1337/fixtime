name: Build, Release, and Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write  # Required for PyPI OIDC

jobs:
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # =========================
          # Windows (x64)
          # =========================
          - os: windows-latest
            arch: x64
            filename: fixtime-windows-x64.exe
            binary: dist/fixtime.exe

          # =========================
          # Linux (x64)
          # =========================
          - os: ubuntu-latest
            arch: x64
            filename: fixtime-linux-x64
            binary: dist/fixtime

          # =========================
          # Linux ARM64 - NATIVE ARM RUNNER!
          # =========================
          - os: ubuntu-24.04-arm
            arch: arm64
            filename: fixtime-linux-arm64
            binary: dist/fixtime

          # =========================
          # macOS (Intel)
          # =========================
          - os: macos-14
            arch: x64
            filename: fixtime-macos-x64
            binary: dist/fixtime

          # =========================
          # macOS ARM64 - NATIVE ARM RUNNER!
          # =========================
          - os: macos-15
            arch: arm64
            filename: fixtime-macos-arm64
            binary: dist/fixtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Show environment
        shell: bash
        run: |
          echo "OS: $(uname -s 2>/dev/null || echo Windows)"
          echo "Architecture: $(uname -m 2>/dev/null || echo Windows)"
          python --version
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller --onefile --clean --name fixtime fixtime.py

      - name: Rename artifact
        shell: bash
        run: |
          # Rename the binary to the architecture-specific name
          if [ -f "dist/fixtime.exe" ]; then
            mv dist/fixtime.exe "dist/${{ matrix.filename }}"
          elif [ -f "dist/fixtime" ]; then
            mv dist/fixtime "dist/${{ matrix.filename }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Release files:"
          ls -lah artifacts/
          echo ""
          echo "File details:"
          if command -v file &> /dev/null; then
            file artifacts/* 2>/dev/null || echo "file command not available"
          fi

      - name: Set release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: fixtime ${{ steps.release_tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # PyPI Publishing Job - FIXED! (Now works for both push and manual)
  # ============================================================
  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # ✅ FIXED: Now works for both push AND manual triggers
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: pypi  # ⚠️ MUST match what you set in PyPI
    permissions:
      contents: read
      id-token: write  # Required for OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build package for PyPI
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
            skip-existing: true
            verbose: true
            # ✅ No API token needed - uses OIDC automatically!
