[project]
name = "fixtime"
version = "2.0.1"
description = "Time synchronization tool for Kerberos authentication"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ntplib",
    "click",
    "python-dateutil",
    "requests"
]
authors = [
    {name = "watcher1337"}
]

[project.urls]
Homepage = "https://github.com/watcher1337/fixtime"
Repository = "https://github.com/watcher1337/fixtime"
Issues = "https://github.com/watcher1337/fixtime/issues"

[project.scripts]
fixtime = "fixtime:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
